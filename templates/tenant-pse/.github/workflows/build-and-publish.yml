name: build-and-publish

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-publish:
    name: build-and-publish
    uses: OWNER/platform-workflows/.github/workflows/build-and-publish.yml@v1
    with:
      tenant: pse
      platform_repository: OWNER/platform-workflows
      platform_ref: v1
