name: build-and-publish

# Runs only when the pull request targets main. Every source branch is allowed
# to merge here. The job lints, compiles, and publishes one immutable digest.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  push:
    branches:
      - main
  workflow_call:
    inputs:
      tenant:
        description: Tenant slug. The pilot repository uses pse.
        required: false
        type: string
        default: pse
      platform_repository:
        description: Repository that holds the policy package.
        required: false
        type: string
        default: ""
      platform_ref:
        description: Pin of the policy package. Tenant callers pass a release tag.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: build-and-publish-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: build-and-publish
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out policy package
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.platform_repository || github.repository }}
          ref: ${{ inputs.platform_ref || github.sha }}
          path: platform

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce the official promotion route
        working-directory: platform
        env:
          TENANT: ${{ inputs.tenant || 'pse' }}
          SOURCE: ${{ github.head_ref }}
          TARGET: ${{ github.base_ref }}
        run: python -m policy.cli --tenant "$TENANT" --source "$SOURCE" --target "$TARGET"

      - name: Check out the application
        uses: actions/checkout@v4
        with:
          path: application

      - name: Lint and compile
        working-directory: platform
        run: python -m policy.lint --path ../application/src

      - name: Publish the immutable artifact
        working-directory: platform
        env:
          TENANT: ${{ inputs.tenant || 'pse' }}
          SOURCE: ${{ github.head_ref }}
          TARGET: ${{ github.base_ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: python -m policy.release --stage publish --tenant "$TENANT" --source "$SOURCE" --target "$TARGET" --sha "$SHA" --output ../dist/artifact-manifest.json

      - name: Upload the simulated Artifact Registry manifest
        uses: actions/upload-artifact@v4
        with:
          name: artifact-registry-${{ github.event.pull_request.head.sha }}
          path: dist/artifact-manifest.json
          if-no-files-found: error

  publish-main:
    name: publish-main
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out policy package
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.platform_repository || github.repository }}
          ref: ${{ inputs.platform_ref || github.sha }}
          path: platform

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check out the application at the merge commit
        uses: actions/checkout@v4
        with:
          path: application

      - name: Lint and compile
        working-directory: platform
        run: python -m policy.lint --path ../application/src

      - name: Publish the merge commit
        working-directory: platform
        env:
          TENANT: ${{ inputs.tenant || 'pse' }}
          SHA: ${{ github.sha }}
        run: python -m policy.release --stage publish-main --tenant "$TENANT" --sha "$SHA" --output ../dist/artifact-manifest.json

      - name: Upload the simulated Artifact Registry manifest
        uses: actions/upload-artifact@v4
        with:
          name: artifact-registry-${{ github.sha }}
          path: dist/artifact-manifest.json
          if-no-files-found: error
